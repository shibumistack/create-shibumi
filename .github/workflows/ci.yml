name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check
      - name: forbid shell-string exec in shipped surface
        run: |
          if grep -rn "execSync\|spawnSync(\"\|spawn(\"" src/ scripts/; then
            echo "shell-string exec found in src/ or scripts/"; exit 1
          fi
          if find src -type l | grep .; then
            echo "symlinks found in src/"; exit 1
          fi
      - name: assert packed tarball matches allowlist and required manifest
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const files = require("/tmp/pack.json")[0].files.map(f => f.path);
            const bad = files.filter(p =>
              !/^(LICENSE$|README\.md$|package\.json$|scripts\/ship\.lock\.json$|src\/(cli|args|create)\.ts$|src\/templates\/ship\.ts$|src\/templates\/(static|web|full-stack|blog)\/)/.test(p)
              || /(^|\/)(\.env|id_rsa|.*\.(pem|key|p12))$/.test(p));
            if (bad.length) { console.error("unexpected packed files:", bad); process.exit(1); }
            const required = [
              "src/cli.ts", "src/args.ts", "src/create.ts",
              "src/templates/ship.ts",
              "scripts/ship.lock.json",
              "src/templates/static/gitignore",
              "src/templates/web/gitignore",
              "src/templates/web/.dockerignore",
              "src/templates/web/bun.lock",
              "src/templates/blog/gitignore",
              "src/templates/blog/bun.lock",
              "src/templates/blog/public/og-default.png",
              "src/templates/blog/src/content/blog/own-your-source.md",
              "src/templates/full-stack/gitignore",
              "src/templates/full-stack/bun.lock",
              "src/templates/full-stack/src/db/migrations/0001_notes.sql",
              "src/templates/full-stack/.dockerignore",
              "src/templates/full-stack/Dockerfile",
              "src/templates/full-stack/compose.yaml",
              "src/templates/full-stack/scripts/db.ts",
              "src/templates/web/public/vendor/alpine-csp-3.16.2.min.js",
            ];
            const missing = required.filter(p => !files.includes(p));
            if (missing.length) { console.error("required files missing from pack:", missing); process.exit(1); }
          '
      - name: web template acceptance (scaffold, test, check, build, image)
        run: |
          cd "$(mktemp -d)"
          bun "$GITHUB_WORKSPACE/src/cli.ts" fixture-web --yes --template web --no-git
          cd fixture-web
          bun test
          bun run check
          bun run build
          docker build -t fixture-web .
          docker run -d --rm --name fixture-web -p 127.0.0.1:39132:3000 fixture-web
          sleep 3
          wget -q -T 5 -O - http://127.0.0.1:39132/healthz | grep -q '"ok":true'
          test "$(docker exec fixture-web whoami)" = "bun"
          docker rm -f fixture-web
      - name: full-stack template acceptance (scaffold, test, image, persistence)
        run: |
          cd "$(mktemp -d)"
          bun "$GITHUB_WORKSPACE/src/cli.ts" fixture-data --yes --template full-stack --no-git
          cd fixture-data
          bun test
          bun run check
          bun run build
          docker build -t fixture-data .
          docker volume create fsvol
          docker run -d --rm --name fs1 -v fsvol:/data -p 127.0.0.1:39133:3000 fixture-data
          sleep 3
          wget -q -T 5 -O - http://127.0.0.1:39133/api/notes | grep -q 'It persists.'
          docker exec fs1 bun -e 'import { Database } from "bun:sqlite"; new Database("/data/app.db").query("INSERT INTO notes (title) VALUES (?)").run("survives");'
          docker rm -f fs1
          docker run -d --rm --name fs2 -v fsvol:/data -p 127.0.0.1:39133:3000 fixture-data
          sleep 3
          wget -q -T 5 -O - http://127.0.0.1:39133/api/notes | grep -q 'survives'
          docker rm -f fs2
      - name: blog template acceptance (scaffold, build, artifacts)
        run: |
          cd "$(mktemp -d)"
          bun "$GITHUB_WORKSPACE/src/cli.ts" fixture-blog --yes --template blog --no-git
          cd fixture-blog
          bun run build
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/rss.xml
          test -f dist/sitemap-index.xml
          test -f dist/llms.txt
          test -f dist/robots.txt
          test -f dist/og-default.png
          test -f dist/posts/own-your-source/index.html
          test -f dist/posts/own-your-source.md
          grep -q 'og:image' dist/posts/own-your-source/index.html
          grep -q 'text/markdown' dist/posts/own-your-source/index.html
