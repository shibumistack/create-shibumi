services:
  app:
    build: .
    ports:
      - "127.0.0.1:${SHIBUMI_PORT:-9001}:3000"
    environment:
      DB_PATH: /data/app.db
    volumes:
      - app_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  app_data:
