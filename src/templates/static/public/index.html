    <main>
      <h1>It ships.</h1>
      <p>Plain files in <code>public/</code>. Edit them, commit, run <code>bun ship</code>.</p>
      <p>Using Astro, Jekyll, Eleventy, or another generator? Point its output here, or run <code>bun ship:setup</code> in that project instead; the Ship client packages any verified build directory.</p>
    </main>
